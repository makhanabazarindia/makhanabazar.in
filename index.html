    body {
      background: #fffdf7;
      color: #222;
    }

    header {
      background: #173d25;
      color: white;
      padding: 18px 20px;

    }

      font-size: 28px;

    header p {

      opacity: 0.9;

      width: 100%;
      background: #f5f0df;

    .banner img {
      width: 100%;

      object-fit: cover;
