<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Makhana Bazar | Premium Makhana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fffdf7;
      color: #222;
    }

    header {
      background: #173d25;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .banner {
      width: 100%;
      background: #f5f0df;
    }

    .banner img {
      width: 100%;
      display: block;
      max-height: 500px;
      object-fit: cover;
    }

    footer {
      margin-top: 30px;
      background: #173d25;
      color: white;
      text-align: center;
      padding: 22px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Makhana Bazar</h1>
    <p>Premium Handpicked Makhana</p>
  </header>

  <!-- WEBSITE BANNER -->
  <div class="banner">
    <img
      src="41BB9F73-9C3D-4495-B367-3C489FB82EF1.png"
      alt="Makhana Bazar Premium Makhana">
  </div>
  <!-- Ratan Bhog Product -->
  <section style="padding: 35px 18px; text-align: center;">

    <div style="
      max-width: 430px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    ">

      <img
        src="66844D78-EB34-47FD-A164-D73FCDCD65C1.png"
        alt="Ratan Bhog Handpicked Makhana"
        style="
          width: 100%;
          max-height: 360px;
          object-fit: contain;
          border-radius: 12px;
        "
      >

      <h2 style="
        color: #173d25;
        font-size: 23px;
        margin: 15px 0 8px;
      ">
        Ratan Bhog Handpicked Makhana
      </h2>

      <p style="
        color: #666;
        font-size: 15px;
        margin-bottom: 18px;
      ">
        Premium quality handpicked makhana.
      </p>

      <label style="
        display: block;
        text-align: left;
        font-weight: bold;
        color: #173d25;
        margin-bottom: 8px;
      ">
        Choose Quantity
      </label>

      <select style="
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        background: white;
        margin-bottom: 15px;
      ">
        <option>1 kg</option>
        <option>2 kg</option>
        <option>3 kg</option>
        <option>4 kg</option>
        <option>5 kg</option>
      </select>

      <button style="
        width: 100%;
        background: #173d25;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
      ">
        🛒 Add to Cart
      </button>

    </div>

  </section>
  <footer>
    © 2026 Makhana Bazar. All Rights Reserved.
  </footer>

</body>
</html>
