<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Makhana Bazar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #176b35;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 15px;
    }

    .banner {
      background: #fff3c4;
      text-align: center;
      padding: 18px 10px;
      border-bottom: 2px solid #e5c45b;
    }

    .banner h2 {
      color: #176b35;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .banner p {
      font-size: 17px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 25px auto;
    }

    .section-title {
      text-align: center;
      color: #176b35;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .product img {
      width: 100%;
      max-width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .product h3 {
      color: #176b35;
      font-size: 21px;
      margin-bottom: 8px;
    }

    .product p {
      color: #555;
      margin-bottom: 8px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #d35400;
      margin: 10px 0;
    }

    .pack {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .whatsapp {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    .whatsapp:hover {
      background: #1ebe5d;
    }

    .about {
      background: white;
      margin-top: 30px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .about h2 {
      color: #176b35;
      margin-bottom: 12px;
    }

    .about p {
      line-height: 1.6;
      color: #555;
    }

    footer {
      background: #176b35;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 35px;
    }

    .order-box {
      text-align: center;
      margin-top: 25px;
    }

    .order-box h2 {
      color: #176b35;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <header>
