<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Makhana Bazar - Premium Makhana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      padding: 30px 20px 50px;
      text-align: center;
      border-radius: 0 0 20px 20px;
    }

    .product {
      margin-bottom: 55px;
    }

    .product img {
      width: 100%;
      max-width: 370px;
      height: auto;
      display: block;
      margin: 0 auto 25px;
      border-radius: 5px;
    }

    .product h1 {
      font-size: 42px;
      color: #176b3a;
      margin: 10px 0 18px;
    }

    .product p {
      font-size: 29px;
      color: #555;
      margin: 12px 0;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      color: #176b3a;
      margin: 18px 0;
    }

    .order-btn {
      display: inline-block;
      background: #17733b;
      color: white;
      border: none;
      padding: 17px 55px;
      border-radius: 15px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .order-btn:hover {
      background: #125b30;
    }

    /* ORDER FORM */

    #orderForm {
      display: none;
      margin-top: 30px;
      padding: 25px 20px;
      background: #f7faf7;
      border-radius: 18px;
      border: 2px solid #17733b;
      text-align: left;
    }

    #orderForm h2 {
      text-align: center;
      color: #176b3a;
      font-size: 30px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #17733b;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #777;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    @media (max-width: 600px) {

      .container {
        padding: 25px 15px 40px;
      }

      .product h1 {
        font-size: 34px;
      }

      .product p {
        font-size: 23px;
      }

      .price {
        font-size: 28px;
      }

      .order-btn {
        font-size: 22px;
        padding: 15px 45px;
      }

      .product img {
        max-width: 370px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 250G PRODUCT -->
    <div class="product">

      <img
        src="125D3341-3834-43BA-B6E2-EBF04A4C32E2.png"
        alt="250g Premium Makhana"
      >

      <h1>Premium Makhana</h1>

      <p>Fresh &amp; Handpicked Makhana</p>

      <p>250g Pack</p>

      <div class="price">₹449</div>

      <button
        class="order-btn"
        onclick="openOrderForm('250g - ₹449')">
        Order Now
      </button>

    </div>


    <!-- 500G PRODUCT -->
    <div class="product">

      <img
        src="500g.png"
        alt="500g Premium Makhana"
      >

      <h1>Premium Makhana</h1>

      <p>Fresh &amp; Handpicked Makhana</p>

      <p>500g Pack</p>

      <div class="price">₹899</div>

      <button
        class="order-btn"
        onclick="openOrderForm('500g - ₹899')">
        Order Now
      </button>

    </div>


    <!-- ORDER FORM -->

    <div id="orderForm">

      <h2>Place Your Order</h2>

      <label for="product">Select Product</label>

      <select id="product">
        <option value="250g - ₹449">250g - ₹449</option>
        <option value="500g - ₹899">500g - ₹899</option>
      </select>


      <label for="name">Your Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
      >


      <label for="phone">Mobile Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your mobile number"
      >


      <label for="address">Delivery Address</label>

      <textarea
        id="address"
        placeholder="Enter your complete delivery address"
      ></textarea>


      <button
        class="submit-btn"
        onclick="placeOrder()">
        Place Order
      </button>

      <button
        class="close-btn"
        onclick="closeOrderForm()">
        Close
      </button>

    </div>

  </div>


  <script>

    function openOrderForm(product) {

      document.getElementById("orderForm").style.display = "block";

      document.getElementById("product").value = product;

      document.getElementById("orderForm").scrollIntoView({
        behavior: "smooth"
      });
    }


    function closeOrderForm() {

      document.getElementById("orderForm").style.display = "none";

    }


    function placeOrder() {

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const product = document.getElementById("product").value;

      if (name === "" || phone === "" || address === "") {

        alert("Please fill all the details.");

        return;
      }

      alert(
        "Thank you " + name +
        "! Your order request for " +
        product +
        " has been received."
      );

    }

  </script>

</body>
</html>
