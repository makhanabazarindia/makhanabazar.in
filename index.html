<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Makhana Bazar India - Premium Makhana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      padding: 30px 20px 50px;
      text-align: center;
    }

    .product {
      margin-bottom: 50px;
    }

    .product img {
      width: 100%;
      max-width: 370px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
      border-radius: 8px;
    }

    .product h1 {
      font-size: 36px;
      color: #176b3a;
      margin: 15px 0;
    }

    .product p {
      font-size: 21px;
      color: #555;
      margin: 10px 0;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #176b3a;
      margin: 15px 0;
    }

    @media (max-width: 600px) {

      .container {
        padding: 25px 15px 40px;
      }

      .product h1 {
        font-size: 30px;
      }

      .product p {
        font-size: 20px;
      }

      .price {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- PRODUCTS WILL BE ADDED HERE -->

  </div>

</body>
</html>
